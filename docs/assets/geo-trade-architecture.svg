<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">GEO_TRADE platform architecture</title>
<desc id="desc">Layered architecture showing MetaTrader 5 data source, Python ingestion, validation and feature engineering, storage, quantitative research, API, dashboard and observability.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101d31"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0b6178"/><stop offset="1" stop-color="#123e62"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#145c48"/><stop offset="1" stop-color="#174b55"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#60e6ff"/></marker>
  <style>
    .h{font:700 34px Arial,sans-serif;fill:#f1f7ff}.sub{font:16px Arial,sans-serif;fill:#9eb4c9}
    .layer{font:700 15px Arial,sans-serif;letter-spacing:2px;fill:#60e6ff}
    .box{fill:#10243a;stroke:#28617a;stroke-width:2;rx:18;filter:url(#shadow)}
    .box2{fill:#102a2d;stroke:#2b866f;stroke-width:2;rx:18;filter:url(#shadow)}
    .title{font:700 19px Arial,sans-serif;fill:#f2f8ff}.txt{font:14px Arial,sans-serif;fill:#b8c9d9}
    .tag{font:700 12px Arial,sans-serif;fill:#60e6ff}.future{stroke-dasharray:9 7;opacity:.92}
    .arrow{stroke:#60e6ff;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .soft{stroke:#31516b;stroke-width:1}
  </style>
</defs>
<rect width="1400" height="900" rx="28" fill="url(#bg)"/>
<text x="70" y="72" class="h">GEO_TRADE</text><text x="70" y="103" class="sub">Financial Market Data Engineering · Quantitative Research Platform</text>
<rect x="1110" y="48" width="220" height="38" rx="19" fill="#123d39" stroke="#2b866f"/><text x="1220" y="72" text-anchor="middle" class="tag" fill="#7fffd0">CURRENT + ROADMAP</text>

<text x="70" y="160" class="layer">01 / MARKET DATA SOURCES</text>
<rect x="70" y="182" width="1260" height="112" rx="20" fill="#0d1c2e" stroke="#29445c"/>
<rect x="100" y="205" width="350" height="66" class="box"/>
<text x="125" y="232" class="title">MetaTrader 5</text><text x="125" y="254" class="txt">Terminal · symbols · historical H1 OHLCV</text>
<rect x="525" y="205" width="350" height="66" class="box future"/>
<text x="550" y="232" class="title">External market providers</text><text x="550" y="254" class="txt">Broker APIs · exchange feeds · reference data</text>
<rect x="950" y="205" width="350" height="66" class="box future"/>
<text x="975" y="232" class="title">Alternative data</text><text x="975" y="254" class="txt">Macro indicators · news · sentiment</text>

<path d="M275 294 V342" class="arrow"/><path d="M700 294 V342" class="arrow"/><path d="M1125 294 V342" class="arrow"/>
<text x="70" y="330" class="layer">02 / INGESTION &amp; DATA QUALITY</text>
<rect x="70" y="352" width="1260" height="152" rx="20" fill="#0d1c2e" stroke="#29445c"/>
<rect x="100" y="378" width="270" height="94" class="box"/>
<text x="123" y="410" class="title">Python Ingestion</text><text x="123" y="435" class="txt">Connect · select · fetch</text><text x="123" y="455" class="txt">Batch orchestration</text>
<path d="M370 425 H415" class="arrow"/>
<rect x="425" y="378" width="270" height="94" class="box"/>
<text x="448" y="410" class="title">Validation &amp; Quality</text><text x="448" y="435" class="txt">OHLC rules · duplicates</text><text x="448" y="455" class="txt">Gaps · schema · audit</text>
<path d="M695 425 H740" class="arrow"/>
<rect x="750" y="378" width="270" height="94" class="box"/>
<text x="773" y="410" class="title">Feature Engineering</text><text x="773" y="435" class="txt">Returns · indicators · time</text><text x="773" y="455" class="txt">Warm-up · point-in-time</text>
<path d="M1020 425 H1065" class="arrow"/>
<rect x="1075" y="378" width="225" height="94" class="box2"/>
<text x="1098" y="410" class="title">Data Contracts</text><text x="1098" y="435" class="txt">Canonical OHLCV</text><text x="1098" y="455" class="txt">Versioned datasets</text>

<path d="M875 504 V548" class="arrow"/>
<text x="70" y="540" class="layer">03 / STORAGE &amp; CONSUMPTION</text>
<rect x="70" y="560" width="1260" height="138" rx="20" fill="#0d1c2e" stroke="#29445c"/>
<rect x="100" y="584" width="270" height="88" class="box2"/>
<text x="123" y="616" class="title">Raw / Bronze</text><text x="123" y="641" class="txt">Immutable source snapshots</text><text x="123" y="660" class="tag">PLANNED</text>
<rect x="425" y="584" width="270" height="88" class="box2"/>
<text x="448" y="616" class="title">PostgreSQL / TimescaleDB</text><text x="448" y="641" class="txt">Curated time-series tables</text><text x="448" y="660" class="tag">PLANNED</text>
<rect x="750" y="584" width="250" height="88" class="box"/>
<text x="773" y="616" class="title">Research datasets</text><text x="773" y="641" class="txt">Parquet · CSV · feature sets</text><text x="773" y="660" class="tag">CSV CURRENT</text>
<rect x="1055" y="584" width="245" height="88" class="box future"/>
<text x="1078" y="616" class="title">Supabase</text><text x="1078" y="641" class="txt">Managed Postgres · Auth</text><text x="1078" y="660" class="tag">OPTIONAL TARGET</text>

<path d="M560 698 V740" class="arrow"/><path d="M875 698 V740" class="arrow"/><path d="M1175 698 V740" class="arrow"/>
<text x="70" y="730" class="layer">04 / QUANTITATIVE RESEARCH &amp; OPERATIONS</text>
<rect x="70" y="750" width="1260" height="105" rx="20" fill="#0d1c2e" stroke="#29445c"/>
<rect x="100" y="770" width="250" height="64" class="box future"/>
<text x="122" y="797" class="title">Backtesting</text><text x="122" y="818" class="txt">Vectorbt / event-driven</text>
<rect x="385" y="770" width="250" height="64" class="box future"/>
<text x="407" y="797" class="title">ML Research</text><text x="407" y="818" class="txt">Walk-forward · no leakage</text>
<rect x="670" y="770" width="250" height="64" class="box future"/>
<text x="692" y="797" class="title">API &amp; Dashboard</text><text x="692" y="818" class="txt">FastAPI / analytics UI</text>
<rect x="955" y="770" width="345" height="64" class="box future"/>
<text x="977" y="797" class="title">Observability &amp; Governance</text><text x="977" y="818" class="txt">Logs · metrics · lineage · alerts</text>
<text x="70" y="882" class="sub">Solid boxes = current repository scope · Dashed boxes = proposed roadmap · Research only; no live order execution is implemented.</text>
</svg>